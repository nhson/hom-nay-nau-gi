<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Trợ lý thực đơn gia đình: random mỗi ngày 3 món (xào/luộc/salad, canh, món mặn), kèm hướng dẫn nấu từng bước, tự tổng hợp danh sách đi chợ, lưu thực đơn yêu thích.">
<link rel="icon" href="data:,">
<title>Hôm Nay Nấu Gì</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FBF7EE;
    --surface:#FFFFFF;
    --surface-2:#F4EEE0;
    --ink:#241F18;
    --ink-dim:#6B6152;
    --jade:#2F5D50;
    --jade-ink:#FFFFFF;
    --turmeric:#D98A22;
    --turmeric-ink:#241F18;
    --chili:#B23A22;
    --line:#E7DECB;
    --shadow: 0 1px 2px rgba(36,31,24,.06), 0 8px 24px -12px rgba(36,31,24,.18);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181D17;
      --surface:#212720;
      --surface-2:#262C24;
      --ink:#F1ECDD;
      --ink-dim:#A39C89;
      --jade:#7CAE9B;
      --jade-ink:#12211C;
      --turmeric:#E9A94E;
      --turmeric-ink:#20160A;
      --chili:#E08066;
      --line:#333A30;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181D17;
    --surface:#212720;
    --surface-2:#262C24;
    --ink:#F1ECDD;
    --ink-dim:#A39C89;
    --jade:#7CAE9B;
    --jade-ink:#12211C;
    --turmeric:#E9A94E;
    --turmeric-ink:#20160A;
    --chili:#E08066;
    --line:#333A30;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:640px;
    margin:0 auto;
    min-height:100%;
    padding:0 18px 100px;
  }
  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    margin:0;
    text-wrap:balance;
  }
  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--bg);
    padding-top:calc(env(safe-area-inset-top,0px) + 22px);
    z-index:10;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .brand h1{ font-size:26px; letter-spacing:-.01em; }
  .brand .mark{ color:var(--turmeric); }
  .today-date{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:2px;
    text-transform:capitalize;
  }
  nav.tabs{
    display:flex;
    gap:4px;
    margin-top:18px;
    padding:4px;
    background:var(--surface-2);
    border-radius:999px;
  }
  nav.tabs button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 6px;
    border-radius:999px;
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-dim);
    cursor:pointer;
  }
  nav.tabs button.active{
    background:var(--jade);
    color:var(--jade-ink);
  }
  main{ padding-top:18px; }
  section{ display:none; }
  section.active{ display:block; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---- Today view ---- */
  .hero-actions{
    display:flex;
    gap:10px;
    margin-bottom:16px;
  }
  button.btn{
    font:inherit;
    font-weight:600;
    font-size:14px;
    border-radius:12px;
    border:1px solid transparent;
    padding:11px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--turmeric); color:var(--turmeric-ink); flex:1; justify-content:center; }
  .btn-ghost{ background:var(--surface); border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-text{ background:transparent; border:none; color:var(--jade); padding:6px 0; font-weight:600; font-size:13.5px; }
  .btn-danger{ color:var(--chili); }

  .menu-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .dish-slot{
    padding:16px;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .dish-slot .cat-tag{
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--jade);
    display:block;
    margin-bottom:4px;
  }
  .dish-slot .dish-name{ font-size:19px; }
  .badge-row{ display:inline-flex; gap:6px; margin-left:8px; vertical-align:middle; }
  .badge{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:2px 8px;
    border-radius:999px;
  }
  .badge-chay{ background:var(--jade); color:var(--jade-ink); }
  .badge-region{ background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line); }
  .dish-slot .dish-meta{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:4px;
  }
  .dish-slot .dish-ingr{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:6px;
    line-height:1.5;
  }
  details.recipe{ margin-top:10px; }
  details.recipe summary{
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    color:var(--jade);
    list-style:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  details.recipe summary::-webkit-details-marker{ display:none; }
  details.recipe summary::before{
    content:'▸';
    font-size:10px;
    display:inline-block;
    transition:transform .15s ease;
  }
  details.recipe[open] summary::before{ transform:rotate(90deg); }
  details.recipe ol{
    margin:10px 0 0;
    padding-left:20px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink);
  }
  details.recipe ol li{ margin-bottom:7px; }
  details.recipe ol li::marker{ color:var(--turmeric); font-weight:700; }
  details.recipe ol li:last-child{ margin-bottom:0; }
  .slot-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-left:auto;
  }
  .icon-btn{
    width:34px; height:34px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

  .meal-controls{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .meal-controls .chip{ padding:7px 14px; }

  .cooked-banner{
    display:flex; align-items:center; gap:8px;
    font-size:13.5px; color:var(--jade); font-weight:600;
    padding:10px 14px; margin-bottom:16px;
    background:var(--surface-2); border-radius:12px;
  }

  .section-title{
    font-size:14px; font-weight:700; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.04em;
    margin:24px 0 10px;
  }

  .shopping-card{ padding:14px 16px; }
  .shopping-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .shopping-item:last-child{ border-bottom:none; }
  .shopping-item input{ width:18px; height:18px; accent-color:var(--jade); flex-shrink:0; }
  .shopping-item.checked span{ text-decoration:line-through; color:var(--ink-dim); }
  .shopping-item .from{ margin-left:auto; font-size:11.5px; color:var(--ink-dim); }

  .history-strip{ display:flex; flex-direction:column; gap:8px; }
  .history-row{
    display:flex; align-items:baseline; gap:10px;
    padding:10px 14px;
    font-size:13.5px;
  }
  .history-row .h-date{ font-weight:700; color:var(--jade); width:58px; flex-shrink:0; }
  .history-row .h-dishes{ color:var(--ink-dim); }
  .empty{
    text-align:center; color:var(--ink-dim); font-size:14px;
    padding:26px 14px;
  }

  /* ---- Dishes manage view ---- */
  .filter-row{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-dim);
    padding:6px 12px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .chip.active{ background:var(--jade); border-color:var(--jade); color:var(--jade-ink); }

  .dish-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .dish-row:last-child{ border-bottom:none; }
  .dish-row .info{ min-width:0; flex:1; }
  .dish-row .dname{ font-size:15px; font-weight:600; }
  .dish-row .dmeta{ font-size:12px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dish-row .actions{ margin-left:auto; display:flex; gap:6px; flex-shrink:0; }
  .dish-row details.recipe{ flex-basis:100%; margin-top:2px; }

  form.dish-form{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  form.dish-form label{ font-size:12.5px; font-weight:700; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; }
  form.dish-form input, form.dish-form select, form.dish-form textarea{
    font:inherit; font-size:14.5px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    width:100%;
  }
  form.dish-form textarea{ resize:vertical; min-height:52px; }
  .form-row{ display:flex; gap:10px; }
  .form-row > div{ flex:1; }
  .form-actions{ display:flex; gap:10px; margin-top:4px; }

  /* ---- Favorites view ---- */
  .fav-card{ padding:14px 16px; margin-bottom:12px; }
  .fav-card .fav-name{ font-size:17px; font-family:'Fraunces',serif; font-weight:600; }
  .fav-card .fav-dishes{ font-size:13px; color:var(--ink-dim); margin:6px 0 10px; line-height:1.5; }
  .fav-card .fav-actions{ display:flex; gap:8px; }

  /* ---- modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,17,12,.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-backdrop[hidden]{ display:none; }
  .modal{
    background:var(--surface);
    width:100%; max-width:640px;
    border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow);
  }
  .modal h3{ font-size:18px; margin-bottom:12px; }
  .modal input{
    font:inherit; font-size:15px;
    padding:11px 12px; width:100%;
    border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink);
    margin-bottom:12px;
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg);
    padding:10px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow);
    z-index:60;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Hôm nay <span class="mark">nấu gì?</span></h1>
    </div>
    <div class="today-date" id="todayDate"></div>
    <nav class="tabs">
      <button data-tab="today" class="active">Hôm nay</button>
      <button data-tab="dishes">Món ăn</button>
      <button data-tab="favorites">Yêu thích</button>
      <!-- tạm ẩn chức năng Hộ gia đình — bỏ `hidden` để bật lại -->
      <button data-tab="household" hidden>Hộ gia đình</button>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="active">
      <div class="hero-actions">
        <button class="btn btn-primary" id="btnRandomAll">🎲 Random thực đơn</button>
        <button class="btn btn-ghost" id="btnSaveFav">☆ Lưu</button>
      </div>
      <div class="meal-controls" id="mealControls"></div>
      <div id="cookedBanner"></div>
      <div class="menu-list" id="menuList"></div>
      <div class="hero-actions">
        <button class="btn btn-ghost" style="flex:1;justify-content:center" id="btnMarkCooked">✓ Đã nấu hôm nay</button>
      </div>

      <div class="section-title">Danh sách đi chợ</div>
      <div class="card shopping-card" id="shoppingCard"></div>

      <div class="section-title">7 ngày gần đây</div>
      <div class="card" id="historyCard"></div>
    </section>

    <section id="tab-dishes">
      <div class="filter-row" id="catFilter"></div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="btnAddDish">+ Thêm món mới</button>
      </div>
      <div class="card" id="dishListCard"></div>
    </section>

    <section id="tab-favorites">
      <div id="favList"></div>
    </section>

    <section id="tab-household">
      <div id="householdCard"></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="dishModalBackdrop" hidden>
  <div class="modal">
    <h3 id="dishFormTitle">Thêm món mới</h3>
    <form class="dish-form" id="dishForm">
      <div>
        <label>Tên món</label>
        <input type="text" id="fName" required placeholder="VD: Canh chua cá lóc">
      </div>
      <div>
        <label>Kiểu bữa ăn</label>
        <select id="fMealType">
          <option value="buacom">Bữa cơm 3 món</option>
          <option value="buatomonuoc">Bữa 1 món (phở/bún/nui...)</option>
        </select>
      </div>
      <div class="form-row">
        <div id="fCategoryWrap">
          <label>Nhóm món</label>
          <select id="fCategory">
            <option value="xao">Xào / Luộc / Salad</option>
            <option value="canh">Canh</option>
            <option value="man">Món mặn</option>
          </select>
        </div>
        <div>
          <label>Thời gian (phút)</label>
          <input type="number" id="fTime" min="1" placeholder="20">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Vùng miền</label>
          <select id="fRegion">
            <option value="">Không rõ / bỏ trống</option>
            <option value="bac">Miền Bắc</option>
            <option value="trung">Miền Trung</option>
            <option value="nam">Miền Nam</option>
          </select>
        </div>
        <div style="display:flex; align-items:flex-end; padding-bottom:10px;">
          <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14.5px; font-weight:600; color:var(--ink);">
            <input type="checkbox" id="fChay" style="width:18px;height:18px;accent-color:var(--jade);"> Món chay
          </label>
        </div>
      </div>
      <div>
        <label>Nguyên liệu (cách nhau bằng dấu phẩy)</label>
        <textarea id="fIngredients" placeholder="cá lóc, cà chua, me, đậu bắp"></textarea>
      </div>
      <div>
        <label>Hướng dẫn nấu (mỗi bước 1 dòng)</label>
        <textarea id="fSteps" rows="5" placeholder="Cá làm sạch, cắt khúc&#10;Đun sôi nước, dầm me lấy nước chua&#10;Cho cá vào nấu chín..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="fCancel" style="flex:1;justify-content:center">Huỷ</button>
        <button type="submit" class="btn btn-primary">Lưu món</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="favModalBackdrop" hidden>
  <div class="modal">
    <h3>Lưu thực đơn yêu thích</h3>
    <input type="text" id="favNameInput" placeholder="VD: Mâm cơm cuối tuần">
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="favCancel" style="flex:1;justify-content:center">Huỷ</button>
      <button type="button" class="btn btn-primary" id="favConfirm">Lưu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { filterDishes, pickRandom, buildBuaComMenu, pickMonNuoc } from '/logic.js';
import { generateHouseholdCode, isValidHouseholdCode, serializeHouseholdData, parseHouseholdData } from '/household.js';
(function(){
  "use strict";

  var CAT = { xao: 'Xào / Luộc / Salad', canh: 'Canh', man: 'Món mặn' };
  var CAT_ORDER = ['xao','canh','man'];
  var REGION = { bac: 'Miền Bắc', trung: 'Miền Trung', nam: 'Miền Nam' };

  var SEED_DISHES = [
    // Xào / Luộc / Salad
    {id:'x1', category:'xao', mealType:'buacom', chay:true, region:null, name:'Rau muống xào hành boa-rô', time:10, ingredients:['rau muống','hành boa-rô','dầu ăn','nước mắm'], steps:['Rau muống nhặt bỏ lá già, rửa sạch, để ráo.','Hành boa-rô băm nhỏ.','Phi thơm hành boa-rô với dầu ăn trên lửa lớn.','Cho rau muống vào đảo nhanh tay 2-3 phút cho rau chín tới, còn giòn.','Nêm nước mắm, đảo đều rồi tắt bếp.']},
    {id:'x2', category:'xao', mealType:'buacom', chay:true, region:null, name:'Rau lang xào hành boa-rô', time:10, ingredients:['rau lang','hành boa-rô','dầu ăn'], steps:['Rau lang nhặt lá non, rửa sạch, để ráo.','Hành boa-rô băm nhỏ, phi thơm với dầu ăn.','Cho rau lang vào xào lửa lớn 2-3 phút đến khi rau mềm.','Nêm gia vị vừa ăn, tắt bếp.']},
    {id:'x3', category:'xao', mealType:'buacom', chay:false, region:null, name:'Bông cải xanh xào thịt bò', time:15, ingredients:['bông cải xanh','thịt bò','tỏi','dầu hào'], steps:['Thịt bò thái mỏng, ướp tỏi băm, dầu hào, tiêu 10 phút.','Bông cải xanh cắt miếng vừa ăn, chần sơ qua nước sôi.','Phi thơm tỏi, xào thịt bò lửa lớn đến khi tái thì gắp ra.','Cho bông cải vào xào nhanh, nêm dầu hào.','Cho thịt bò lại vào đảo đều, tắt bếp.']},
    {id:'x4', category:'xao', mealType:'buacom', chay:true, region:null, name:'Đậu rồng xào hành boa-rô', time:10, ingredients:['đậu rồng','hành boa-rô','dầu ăn'], steps:['Đậu rồng rửa sạch, cắt xéo miếng vừa ăn.','Phi thơm hành boa-rô băm với dầu ăn.','Cho đậu rồng vào xào lửa lớn 3-4 phút.','Nêm gia vị vừa ăn, tắt bếp khi đậu còn giòn.']},
    {id:'x5', category:'xao', mealType:'buacom', chay:true, region:null, name:'Giá xào hẹ', time:8, ingredients:['giá đỗ','hẹ','dầu ăn'], steps:['Giá đỗ rửa sạch, để ráo. Hẹ cắt khúc 3cm.','Phi thơm dầu ăn.','Cho giá vào xào lửa lớn 1 phút.','Cho hẹ vào đảo nhanh thêm 1 phút, nêm gia vị, tắt bếp ngay để giá không ra nước.']},
    {id:'x6', category:'xao', mealType:'buacom', chay:true, region:null, name:'Su su xào hành boa-rô', time:10, ingredients:['su su','hành boa-rô','dầu ăn'], steps:['Su su gọt vỏ, thái lát mỏng.','Phi thơm hành boa-rô băm với dầu ăn.','Cho su su vào xào lửa lớn 4-5 phút đến khi chín tới.','Nêm gia vị vừa ăn, tắt bếp.']},
    {id:'x7', category:'xao', mealType:'buacom', chay:false, region:null, name:'Cải thìa xào nấm', time:12, ingredients:['cải thìa','nấm','tỏi','dầu hào'], steps:['Cải thìa rửa sạch, bổ đôi. Nấm rửa sạch, cắt miếng vừa ăn.','Phi thơm tỏi băm với dầu ăn.','Cho nấm vào xào trước 2 phút.','Cho cải thìa vào xào chung lửa lớn 2-3 phút.','Nêm dầu hào, đảo đều, tắt bếp.']},
    {id:'x8', category:'xao', mealType:'buacom', chay:false, region:null, name:'Dưa chua xào thịt heo quay', time:15, ingredients:['dưa cải chua','thịt heo quay','hành lá'], steps:['Dưa cải chua rửa sơ cho bớt chua, vắt ráo, cắt khúc.','Thịt heo quay cắt miếng vừa ăn.','Phi thơm hành, cho dưa chua vào xào trước 2-3 phút.','Cho thịt heo quay vào đảo đều, nêm nếm lại cho vừa ăn.','Tắt bếp, rắc hành lá.']},
    {id:'x9', category:'xao', mealType:'buacom', chay:true, region:null, name:'Rau muống luộc', time:8, ingredients:['rau muống','muối'], steps:['Rau muống nhặt sạch, rửa kỹ.','Đun sôi nước với chút muối (và dầu ăn để rau xanh hơn).','Cho rau vào luộc 2-3 phút đến khi rau chín tới.','Vớt ra, có thể ngâm qua nước lạnh để rau giòn xanh.']},
    {id:'x10', category:'xao', mealType:'buacom', chay:true, region:null, name:'Bắp cải luộc', time:10, ingredients:['bắp cải','muối'], steps:['Bắp cải cắt miếng vừa ăn, rửa sạch.','Đun sôi nước với chút muối.','Cho bắp cải vào luộc 3-4 phút đến khi vừa chín mềm.','Vớt ra để ráo, chấm nước mắm hoặc kho quẹt.']},
    {id:'x11', category:'xao', mealType:'buacom', chay:true, region:null, name:'Su su luộc', time:10, ingredients:['su su','muối'], steps:['Su su gọt vỏ, cắt miếng vừa ăn.','Đun sôi nước với chút muối.','Cho su su vào luộc 5-6 phút đến khi chín mềm.','Vớt ra để ráo.']},
    {id:'x12', category:'xao', mealType:'buacom', chay:true, region:null, name:'Đậu bắp luộc', time:8, ingredients:['đậu bắp','muối'], steps:['Đậu bắp rửa sạch, cắt bỏ cuống.','Đun sôi nước với chút muối.','Cho đậu bắp vào luộc 3-4 phút, không luộc quá lâu để tránh nhớt nhiều.','Vớt ra ngâm nước lạnh để giữ màu xanh giòn.']},
    {id:'x13', category:'xao', mealType:'buacom', chay:true, region:null, name:'Bông cải trắng luộc', time:8, ingredients:['bông cải trắng','muối'], steps:['Bông cải trắng cắt miếng vừa ăn, rửa sạch.','Đun sôi nước với chút muối.','Cho bông cải vào luộc 4-5 phút đến khi chín tới.','Vớt ra để ráo.']},
    {id:'x14', category:'xao', mealType:'buacom', chay:true, region:null, name:'Salad bắp cải trộn mè', time:15, ingredients:['bắp cải','cà rốt','mè rang','giấm','đường'], steps:['Bắp cải, cà rốt thái sợi mỏng.','Trộn giấm, đường, chút muối cho tan làm sốt.','Trộn bắp cải, cà rốt với sốt, để 10 phút cho ngấm.','Rắc mè rang lên trên trước khi ăn.']},
    {id:'x15', category:'xao', mealType:'buacom', chay:true, region:null, name:'Salad dưa leo cà chua', time:10, ingredients:['dưa leo','cà chua','hành tây','giấm'], steps:['Dưa leo, cà chua thái miếng vừa ăn. Hành tây thái mỏng, ngâm nước đá cho bớt hăng.','Trộn đều dưa leo, cà chua, hành tây.','Rưới giấm, chút đường, muối, dầu ăn lên trên.','Trộn đều, dùng ngay để rau giữ độ giòn.']},
    {id:'x16', category:'xao', mealType:'buacom', chay:true, region:'bac', name:'Nộm đu đủ', time:20, ingredients:['đu đủ xanh','cà rốt','đậu phộng','rau thơm'], steps:['Đu đủ xanh bào sợi, ngâm nước muối loãng rồi vắt ráo.','Cà rốt bào sợi. Đậu phộng rang giã dập.','Pha nước trộn gỏi: nước mắm, đường, chanh, hành boa-rô và ớt băm.','Trộn đu đủ, cà rốt với nước trộn, để thấm 5-10 phút.','Rắc đậu phộng và rau thơm lên trên.']},
    {id:'x17', category:'xao', mealType:'buacom', chay:true, region:null, name:'Salad rau củ trộn dầu giấm', time:10, ingredients:['xà lách','cà chua','dưa leo','dầu ô liu','giấm'], steps:['Xà lách rửa sạch, để ráo, xé miếng vừa ăn.','Cà chua, dưa leo thái miếng.','Pha sốt dầu giấm theo tỷ lệ 3 dầu ô liu : 1 giấm, thêm muối, tiêu, chút đường.','Trộn đều rau củ với sốt ngay trước khi ăn để rau không bị mềm.']},
    {id:'x18', category:'xao', mealType:'buacom', chay:false, region:'nam', name:'Gỏi ngó sen tôm thịt', time:25, ingredients:['ngó sen','tôm','thịt ba chỉ','rau thơm'], steps:['Ngó sen bào mỏng, ngâm nước chanh muối loãng cho trắng giòn.','Tôm luộc chín, bóc vỏ. Thịt ba chỉ luộc chín, thái mỏng.','Pha nước trộn gỏi chua ngọt: nước mắm, đường, chanh, tỏi ớt.','Trộn ngó sen, tôm, thịt với nước trộn.','Rắc rau thơm, đậu phộng rang lên trên trước khi dùng.']},
    {id:'x19', category:'xao', mealType:'buacom', chay:true, region:null, name:'Đậu hũ chiên sả ớt', time:15, ingredients:['đậu hũ','sả','ớt','nước tương'], steps:['Đậu hũ cắt miếng vuông vừa ăn, để ráo nước.','Chiên đậu hũ vàng giòn các mặt, vớt ra.','Sả, ớt băm nhỏ, phi thơm với dầu ăn.','Cho đậu hũ vào đảo cùng sả ớt, nêm nước tương, đảo đều đến khi thấm.']},
    {id:'x20', category:'xao', mealType:'buacom', chay:true, region:null, name:'Nấm đùi gà xào bơ hành boa-rô', time:12, ingredients:['nấm đùi gà','bơ','hành boa-rô'], steps:['Nấm đùi gà rửa sạch, xé sợi hoặc thái lát.','Đun chảy bơ, phi thơm hành boa-rô băm.','Cho nấm vào xào lửa lớn 5-7 phút đến khi nấm săn lại.','Nêm gia vị vừa ăn, tắt bếp.']},

    // Canh
    {id:'c1', category:'canh', mealType:'buacom', chay:false, region:'nam', name:'Canh chua cá lóc', time:30, ingredients:['cá lóc','me','cà chua','dứa','đậu bắp','giá'], steps:['Cá lóc làm sạch, cắt khúc, ướp chút muối.','Đun sôi nước, dầm me lấy nước chua.','Cho cá vào nấu chín, vớt bọt.','Cho cà chua, dứa, đậu bắp vào nấu thêm 3-4 phút.','Nêm nước mắm, đường, cho giá và rau thơm vào, tắt bếp.']},
    {id:'c2', category:'canh', mealType:'buacom', chay:false, region:'bac', name:'Canh cua mồng tơi', time:20, ingredients:['cua đồng','mồng tơi','mướp'], steps:['Cua đồng giã hoặc xay, lọc lấy nước, bỏ xác.','Đun nước cua trên lửa vừa, khuấy nhẹ đến khi riêu cua nổi lên.','Cho mồng tơi, mướp thái miếng vào nấu chín.','Nêm gia vị vừa ăn, tắt bếp.']},
    {id:'c3', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh tôm nấu bầu', time:15, ingredients:['tôm','bầu'], steps:['Tôm bóc vỏ, băm nhỏ hoặc để nguyên, ướp chút gia vị.','Bầu gọt vỏ, thái miếng vừa ăn.','Phi thơm hành, xào sơ tôm cho thơm.','Đổ nước vào đun sôi, cho bầu vào nấu 3-4 phút đến chín.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'c4', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh rau dền nấu tôm', time:15, ingredients:['rau dền','tôm'], steps:['Tôm bóc vỏ, băm nhỏ, ướp sơ.','Rau dền nhặt rửa sạch.','Phi thơm tôm với chút hành, đổ nước vào đun sôi.','Cho rau dền vào nấu 2-3 phút đến chín mềm.','Nêm gia vị, tắt bếp.']},
    {id:'c5', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh khổ qua nhồi thịt', time:30, ingredients:['khổ qua','thịt bằm','nấm mèo'], steps:['Khổ qua bổ đôi, bỏ ruột, rửa sạch.','Thịt bằm trộn với nấm mèo băm, hành, gia vị làm nhân.','Nhồi nhân vào khổ qua.','Đun sôi nước, thả khổ qua nhồi vào nấu 15-20 phút đến chín mềm.','Nêm gia vị vừa ăn, rắc hành ngò.']},
    {id:'c6', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh cà chua trứng', time:10, ingredients:['cà chua','trứng','hành lá'], steps:['Cà chua thái múi cau. Trứng đánh tan.','Phi thơm hành, xào cà chua cho ra màu và mềm.','Đổ nước vào đun sôi.','Từ từ rót trứng vào theo vòng tròn, khuấy nhẹ tạo vân trứng.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'c7', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh bí đỏ nấu tôm', time:20, ingredients:['bí đỏ','tôm'], steps:['Tôm bóc vỏ, băm nhỏ. Bí đỏ gọt vỏ, cắt miếng vừa ăn.','Phi thơm tôm với hành.','Đổ nước vào đun sôi, cho bí đỏ vào nấu 10-12 phút đến mềm.','Nêm gia vị, tắt bếp.']},
    {id:'c8', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh rong biển đậu hũ', time:15, ingredients:['rong biển','đậu hũ','thịt bằm'], steps:['Rong biển khô ngâm nở, rửa sạch, cắt khúc.','Đậu hũ cắt miếng vuông. Thịt bằm ướp sơ.','Đun nước sôi, cho thịt bằm vào nấu chín, vớt bọt.','Cho đậu hũ và rong biển vào nấu thêm 3-4 phút.','Nêm gia vị, tắt bếp.']},
    {id:'c9', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh cải xanh nấu gừng', time:15, ingredients:['cải xanh','gừng','thịt bằm'], steps:['Cải xanh rửa sạch, cắt khúc. Gừng thái sợi.','Thịt bằm ướp sơ với chút gia vị.','Đun nước sôi, cho thịt bằm vào nấu chín, vớt bọt.','Cho gừng và cải xanh vào nấu 2-3 phút.','Nêm gia vị vừa ăn, tắt bếp.']},
    {id:'c10', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh sườn bí đao', time:30, ingredients:['sườn non','bí đao'], steps:['Sườn non chặt miếng, chần qua nước sôi cho sạch, rửa lại.','Ninh sườn với nước khoảng 25-30 phút cho mềm, vớt bọt.','Bí đao gọt vỏ, cắt miếng vừa ăn.','Cho bí đao vào nấu thêm 5-7 phút đến chín.','Nêm gia vị, rắc hành ngò, tắt bếp.']},
    {id:'c11', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh chua tôm dứa', time:25, ingredients:['tôm','dứa','cà chua','me'], steps:['Tôm bóc vỏ, ướp sơ. Dứa, cà chua cắt miếng.','Đun sôi nước, dầm me lấy nước chua.','Cho cà chua, dứa vào nấu 3-4 phút.','Cho tôm vào nấu chín.','Nêm mắm, đường vừa ăn, rắc rau thơm, tắt bếp.']},
    {id:'c12', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh mướp nấu ngao', time:20, ingredients:['mướp','ngao'], steps:['Ngao ngâm nước vo gạo cho nhả cát, rửa sạch.','Luộc ngao đến khi mở miệng, lọc lấy nước trong, gỡ thịt ngao.','Mướp gọt vỏ, thái miếng vừa ăn.','Đun nước ngao sôi lại, cho mướp vào nấu 2-3 phút.','Cho thịt ngao vào, nêm gia vị, tắt bếp.']},
    {id:'c13', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh rau ngót thịt bằm', time:15, ingredients:['rau ngót','thịt bằm'], steps:['Rau ngót tuốt lá, rửa sạch.','Thịt bằm ướp sơ với gia vị.','Phi thơm hành, xào săn thịt bằm.','Đổ nước vào đun sôi, cho rau ngót vào nấu 2-3 phút.','Nêm gia vị, tắt bếp.']},
    {id:'c14', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh khoai mỡ nấu tôm', time:20, ingredients:['khoai mỡ','tôm'], steps:['Khoai mỡ gọt vỏ, cắt miếng, rửa sạch.','Tôm bóc vỏ, băm nhỏ, ướp sơ.','Phi thơm tôm với hành, đổ nước vào đun sôi.','Cho khoai mỡ vào nấu 8-10 phút đến khi mềm sánh.','Nêm gia vị, tắt bếp.']},
    {id:'c15', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh súp lơ nấu xương', time:30, ingredients:['súp lơ','xương heo','cà rốt'], steps:['Xương heo chần qua nước sôi, rửa sạch.','Ninh xương với nước khoảng 25-30 phút, vớt bọt.','Súp lơ, cà rốt cắt miếng vừa ăn.','Cho cà rốt vào nấu trước 5 phút, sau đó cho súp lơ vào nấu thêm 4-5 phút.','Nêm gia vị, tắt bếp.']},
    {id:'c16', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh cải bó xôi nấu thịt', time:15, ingredients:['cải bó xôi','thịt bằm'], steps:['Cải bó xôi rửa sạch, cắt khúc.','Thịt bằm ướp sơ với gia vị.','Đun nước sôi, cho thịt bằm vào nấu chín, vớt bọt.','Cho cải bó xôi vào nấu 1-2 phút đến chín tới.','Nêm gia vị, tắt bếp.']},
    {id:'c17', category:'canh', mealType:'buacom', chay:false, region:'nam', name:'Canh chua bông so đũa', time:25, ingredients:['bông so đũa','cá','me'], steps:['Bông so đũa nhặt rửa sạch. Cá làm sạch, cắt khúc.','Đun sôi nước, dầm me lấy nước chua.','Cho cá vào nấu chín, vớt bọt.','Cho bông so đũa vào nấu 2 phút.','Nêm mắm đường vừa ăn, tắt bếp.']},
    {id:'c18', category:'canh', mealType:'buacom', chay:false, region:null, name:'Canh bầu nấu tép', time:15, ingredients:['bầu','tép'], steps:['Tép rửa sạch, để ráo. Bầu gọt vỏ, thái miếng.','Phi thơm hành, xào sơ tép cho thơm.','Đổ nước vào đun sôi, cho bầu vào nấu 4-5 phút đến chín.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'c19', category:'canh', mealType:'buacom', chay:true, region:'nam', name:'Canh chua đậu hũ dứa', time:20, ingredients:['đậu hũ','dứa','cà chua','me','giá'], steps:['Đậu hũ cắt miếng vuông, chiên sơ cho săn.','Đun sôi nước, dầm me lấy nước chua.','Cho cà chua, dứa vào nấu 3-4 phút.','Cho đậu hũ vào nấu thêm 2 phút, cho giá và rau thơm vào.','Nêm gia vị chay vừa ăn, tắt bếp.']},
    {id:'c20', category:'canh', mealType:'buacom', chay:true, region:null, name:'Canh bí đỏ đậu phộng', time:20, ingredients:['bí đỏ','đậu phộng','hành lá'], steps:['Đậu phộng ngâm mềm, luộc sơ.','Bí đỏ gọt vỏ, cắt miếng vừa ăn.','Đun nước sôi, cho đậu phộng vào nấu 10 phút cho mềm.','Cho bí đỏ vào nấu thêm 10-12 phút đến khi bí mềm.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'c21', category:'canh', mealType:'buacom', chay:true, region:null, name:'Canh nấm đậu hũ', time:15, ingredients:['nấm','đậu hũ','cà rốt','hành lá'], steps:['Nấm rửa sạch, cắt miếng. Đậu hũ cắt miếng vuông. Cà rốt thái lát.','Đun nước sôi, cho cà rốt vào nấu trước 5 phút.','Cho nấm và đậu hũ vào nấu thêm 3-4 phút.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'c22', category:'canh', mealType:'buacom', chay:true, region:null, name:'Canh khổ qua chay nấu nấm', time:25, ingredients:['khổ qua','nấm mèo','đậu hũ'], steps:['Khổ qua bổ đôi, bỏ ruột, rửa sạch, thái lát.','Nấm mèo ngâm nở, băm nhỏ. Đậu hũ tán nhuyễn trộn cùng nấm mèo làm nhân.','Nhồi nhân vào khổ qua (hoặc thả khổ qua thái lát tự do nếu không nhồi).','Đun sôi nước, cho khổ qua vào nấu 15 phút đến mềm.','Nêm gia vị chay vừa ăn, tắt bếp.']},
    {id:'c23', category:'canh', mealType:'buacom', chay:true, region:null, name:'Canh cải ngọt nấu nấm', time:12, ingredients:['cải ngọt','nấm','gừng'], steps:['Cải ngọt rửa sạch, cắt khúc. Nấm rửa sạch, cắt miếng. Gừng thái sợi.','Đun nước sôi, cho nấm và gừng vào nấu 3 phút.','Cho cải ngọt vào nấu thêm 2 phút đến chín tới.','Nêm gia vị, tắt bếp.']},

    // Món mặn
    {id:'m1', category:'man', mealType:'buacom', chay:false, region:'nam', name:'Thịt kho tàu', time:60, ingredients:['thịt ba chỉ','trứng','nước dừa'], steps:['Thịt ba chỉ cắt miếng vuông, chần qua nước sôi cho sạch.','Ướp thịt với nước mắm, đường, hành tỏi băm khoảng 20 phút.','Thắng nước màu (đường + nước), cho thịt vào đảo săn.','Đổ nước dừa xâm xấp, đun sôi rồi hạ lửa nhỏ, kho khoảng 45 phút.','Cho trứng luộc bóc vỏ vào, kho thêm 10-15 phút đến khi thịt mềm, nước sánh.']},
    {id:'m2', category:'man', mealType:'buacom', chay:false, region:'nam', name:'Cá kho tộ', time:40, ingredients:['cá lóc','nước mắm','đường','tiêu'], steps:['Cá làm sạch, cắt khúc, ướp muối tiêu, nước mắm khoảng 15 phút.','Thắng nước màu bằng đường trong nồi đất (tộ).','Xếp cá vào, thêm nước mắm, đường, tiêu.','Kho lửa nhỏ 25-30 phút, thỉnh thoảng rưới nước kho lên cá.','Rắc tiêu, hành lá khi nước sánh lại, tắt bếp.']},
    {id:'m3', category:'man', mealType:'buacom', chay:false, region:null, name:'Gà kho gừng', time:30, ingredients:['gà','gừng','nước mắm'], steps:['Gà chặt miếng vừa ăn, ướp với gừng thái sợi, nước mắm, tiêu 15 phút.','Phi thơm hành, cho gà vào xào săn.','Đổ nước xâm xấp, đun sôi rồi hạ lửa nhỏ.','Kho 20-25 phút đến khi gà mềm, nước sánh lại.','Nêm lại cho vừa ăn, rắc hành lá.']},
    {id:'m4', category:'man', mealType:'buacom', chay:false, region:null, name:'Thịt kho tiêu', time:30, ingredients:['thịt ba chỉ','tiêu','nước mắm'], steps:['Thịt ba chỉ cắt miếng, ướp với nước mắm, tiêu, hành tỏi băm 20 phút.','Phi thơm tỏi, cho thịt vào xào săn.','Đổ nước xâm xấp, đun sôi rồi hạ lửa nhỏ.','Kho 25-30 phút đến khi thịt mềm, nước sánh.','Rắc thêm tiêu xay trước khi tắt bếp.']},
    {id:'m5', category:'man', mealType:'buacom', chay:false, region:'nam', name:'Tôm rim mặn ngọt', time:15, ingredients:['tôm','nước mắm','đường'], steps:['Tôm rửa sạch, để nguyên vỏ hoặc bóc vỏ chừa đuôi.','Ướp tôm với nước mắm, đường 10 phút.','Phi thơm tỏi, cho tôm vào rim lửa vừa.','Rim đến khi nước sánh lại, bám đều vào tôm, tắt bếp.']},
    {id:'m6', category:'man', mealType:'buacom', chay:true, region:null, name:'Đậu hũ sốt cà chua', time:15, ingredients:['đậu hũ','cà chua','hành lá'], steps:['Đậu hũ cắt miếng vuông, chiên vàng các mặt, vớt ra.','Cà chua băm nhỏ hoặc xay.','Phi thơm hành, xào cà chua cho nhuyễn và ra màu.','Cho đậu hũ vào, thêm chút nước, nêm gia vị, đun sôi nhẹ 5 phút.','Rắc hành lá, tắt bếp.']},
    {id:'m7', category:'man', mealType:'buacom', chay:false, region:null, name:'Thịt rang cháy cạnh', time:20, ingredients:['thịt ba chỉ','nước mắm','đường'], steps:['Thịt ba chỉ cắt miếng vừa ăn, ướp nước mắm, tiêu 15 phút.','Cho thịt vào chảo không dầu (mỡ tự ra), rang lửa vừa.','Rang đến khi thịt săn vàng, cháy cạnh nhẹ.','Nêm thêm chút đường, nước mắm cho đậm, đảo đều đến khi khô nước.']},
    {id:'m8', category:'man', mealType:'buacom', chay:false, region:null, name:'Cá chiên sốt cà', time:20, ingredients:['cá','cà chua','hành'], steps:['Cá làm sạch, khía nhẹ, ướp muối tiêu, chiên vàng hai mặt, vớt ra.','Cà chua, hành băm nhỏ.','Phi thơm hành, xào cà chua nhuyễn.','Cho cá vào, thêm chút nước, rim nhỏ lửa 5-7 phút cho ngấm sốt.','Nêm gia vị vừa ăn, tắt bếp.']},
    {id:'m9', category:'man', mealType:'buacom', chay:false, region:null, name:'Sườn xào chua ngọt', time:30, ingredients:['sườn non','cà chua','dứa'], steps:['Sườn non chặt miếng, chần sơ, rửa sạch, ướp gia vị 15 phút.','Chiên sườn vàng đều, vớt ra.','Phi thơm tỏi, cho cà chua, dứa vào xào.','Pha nước sốt chua ngọt (giấm, đường, nước mắm, tương cà), đổ vào đun sôi.','Cho sườn vào đảo đều đến khi nước sốt sánh bám đều, tắt bếp.']},
    {id:'m10', category:'man', mealType:'buacom', chay:false, region:null, name:'Trứng chiên thịt bằm', time:10, ingredients:['trứng','thịt bằm','hành lá'], steps:['Thịt bằm ướp sơ với chút gia vị.','Đánh tan trứng, trộn thịt bằm và hành lá thái nhỏ vào.','Nêm gia vị vừa ăn.','Đổ hỗn hợp vào chảo dầu nóng, chiên vàng đều hai mặt lửa vừa.']},
    {id:'m11', category:'man', mealType:'buacom', chay:false, region:null, name:'Gà chiên nước mắm', time:25, ingredients:['gà','nước mắm','tỏi'], steps:['Gà chặt miếng vừa ăn, ướp chút muối, chiên vàng giòn, vớt ra.','Pha nước mắm với đường theo tỷ lệ 1:1, đun cho sánh kẹo lại.','Phi thơm tỏi băm, đổ nước mắm đường vào.','Cho gà vào đảo đều đến khi nước mắm bám đều, tắt bếp.']},
    {id:'m12', category:'man', mealType:'buacom', chay:false, region:null, name:'Mực xào sa tế', time:15, ingredients:['mực','sa tế','hành tây'], steps:['Mực làm sạch, cắt khoanh hoặc khía hoa, ướp sơ.','Hành tây cắt múi cau.','Phi thơm tỏi với sa tế.','Cho mực vào xào lửa lớn nhanh tay 2-3 phút.','Cho hành tây vào đảo đều, nêm gia vị, tắt bếp ngay để mực không dai.']},
    {id:'m13', category:'man', mealType:'buacom', chay:false, region:null, name:'Thịt bò xào hành tây', time:15, ingredients:['thịt bò','hành tây','tỏi'], steps:['Thịt bò thái mỏng, ướp tỏi băm, dầu hào, tiêu 10 phút.','Hành tây cắt múi cau.','Xào thịt bò lửa lớn nhanh tay đến khi tái thì gắp ra.','Xào sơ hành tây 1 phút, cho thịt bò vào đảo đều.','Nêm gia vị, tắt bếp ngay để thịt không dai.']},
    {id:'m14', category:'man', mealType:'buacom', chay:false, region:null, name:'Chả trứng hấp', time:20, ingredients:['trứng','thịt bằm','mộc nhĩ'], steps:['Thịt bằm trộn với trứng, mộc nhĩ băm nhỏ, hành lá, gia vị.','Đánh đều hỗn hợp cho mịn.','Đổ vào khuôn hoặc chén sâu lòng.','Hấp cách thủy lửa vừa 20-25 phút đến khi chín, xăm tăm không dính là được.']},
    {id:'m15', category:'man', mealType:'buacom', chay:false, region:null, name:'Cá basa kho nghệ', time:25, ingredients:['cá basa','nghệ','nước mắm'], steps:['Cá basa cắt khúc, ướp với nghệ tươi giã hoặc bột nghệ, nước mắm 20 phút.','Phi thơm hành tỏi, cho cá vào áp chảo sơ hai mặt.','Thêm chút nước, đun sôi rồi hạ lửa nhỏ.','Kho 15-20 phút đến khi nước sánh lại, nêm vừa ăn.']},
    {id:'m16', category:'man', mealType:'buacom', chay:false, region:null, name:'Tôm rang thịt', time:20, ingredients:['tôm','thịt ba chỉ','hành'], steps:['Thịt ba chỉ cắt hạt lựu, tôm bóc vỏ.','Phi thơm hành, xào săn thịt ba chỉ trước.','Cho tôm vào xào chung đến khi tôm chín đỏ.','Nêm nước mắm, đường, rang đến khi hơi khô, đậm vị.']},
    {id:'m17', category:'man', mealType:'buacom', chay:false, region:null, name:'Thịt heo quay', time:60, ingredients:['thịt ba chỉ','ngũ vị hương'], steps:['Thịt ba chỉ luộc sơ, để ráo, xăm da cho đều.','Ướp ngũ vị hương, muối vào phần thịt (tránh dính da), để da khô ráo hoàn toàn.','Nướng hoặc quay lửa vừa cho chín thịt trước, sau đó tăng nhiệt để da phồng giòn.','Quay đến khi da vàng giòn đều, để nguội bớt rồi chặt miếng.']},
    {id:'m18', category:'man', mealType:'buacom', chay:false, region:null, name:'Đậu hũ nhồi thịt sốt cà', time:25, ingredients:['đậu hũ','thịt bằm','cà chua'], steps:['Đậu hũ cắt miếng, khoét giữa nhẹ. Thịt bằm trộn gia vị làm nhân.','Nhồi thịt vào đậu hũ, chiên sơ mặt có nhân cho săn.','Cà chua băm nhuyễn, phi thơm hành rồi xào cà chua.','Cho đậu hũ vào, thêm chút nước, rim nhỏ lửa 10 phút đến khi thịt chín và sốt sánh.','Nêm gia vị, rắc hành lá, tắt bếp.']},
    {id:'m19', category:'man', mealType:'buacom', chay:true, region:null, name:'Đậu hũ kho tiêu chay', time:20, ingredients:['đậu hũ','tiêu','nước tương','đường'], steps:['Đậu hũ cắt miếng vuông, chiên sơ cho săn mặt ngoài.','Thắng nước màu bằng đường, cho đậu hũ vào đảo đều.','Thêm nước tương và chút nước, đun sôi rồi hạ lửa nhỏ.','Kho 10-12 phút đến khi nước sánh lại, rắc tiêu, tắt bếp.']},
    {id:'m20', category:'man', mealType:'buacom', chay:true, region:null, name:'Nấm kho tiêu chay', time:20, ingredients:['nấm đông cô','nấm rơm','tiêu','nước tương'], steps:['Nấm đông cô, nấm rơm rửa sạch, để ráo, cắt miếng vừa ăn.','Phi thơm hành, cho nấm vào xào săn.','Thêm nước tương, chút đường, đổ nước xâm xấp.','Kho lửa nhỏ 10-12 phút đến khi nước sánh lại, rắc tiêu, tắt bếp.']},
    {id:'m21', category:'man', mealType:'buacom', chay:true, region:null, name:'Tàu hũ ky chiên giòn sốt me chay', time:20, ingredients:['tàu hũ ky','me','đường','nước tương'], steps:['Tàu hũ ky chiên vàng giòn, vớt ra để ráo dầu.','Dầm me lấy nước cốt, lọc bỏ hạt.','Đun nước me với đường, nước tương đến khi sánh lại làm sốt.','Rưới sốt me lên tàu hũ ky, dùng ngay khi còn giòn.']},

    // Bữa 1 món (Kiểu bữa ăn riêng — xem ADR-0002)
    {id:'t1', category:null, mealType:'buatomonuoc', chay:false, region:'bac', name:'Phở bò', time:60, ingredients:['bánh phở','thịt bò','xương bò','hành tây','gừng','quế hồi'], steps:['Xương bò chần qua nước sôi, rửa sạch.','Nướng gừng và hành tây cho thơm, cho vào nồi ninh cùng xương 3-4 tiếng, vớt bọt thường xuyên.','Cho quế, hồi, thảo quả vào túi vải, thả vào nồi nước dùng ninh cùng 30 phút cuối.','Nêm nước mắm, muối cho vừa vị, lọc lại nước dùng cho trong.','Trụng bánh phở, xếp thịt bò thái mỏng lên trên, chan nước dùng đang sôi, rắc hành ngò.']},
    {id:'t2', category:null, mealType:'buatomonuoc', chay:false, region:'bac', name:'Phở gà', time:45, ingredients:['bánh phở','gà','hành tây','gừng'], steps:['Gà làm sạch, luộc chín cùng gừng và hành tây nướng thơm, vớt bọt.','Vớt gà ra, xé hoặc thái miếng vừa ăn.','Nêm nước luộc gà với nước mắm, muối cho vừa vị làm nước dùng.','Trụng bánh phở, xếp thịt gà lên trên, chan nước dùng nóng, rắc hành ngò.']},
    {id:'t3', category:null, mealType:'buatomonuoc', chay:false, region:'trung', name:'Bún bò Huế', time:75, ingredients:['bún','thịt bò','giò heo','sả','mắm ruốc'], steps:['Giò heo và xương bò chần qua nước sôi, rửa sạch.','Ninh xương và giò heo với sả đập dập trong 2-3 tiếng, vớt bọt.','Pha mắm ruốc với nước, lọc cặn, cho vào nồi nước dùng.','Nêm nước mắm, đường, ớt sa tế cho vừa vị đậm đà đặc trưng.','Trụng bún, xếp thịt bò, giò heo lên trên, chan nước dùng, ăn kèm rau sống.']},
    {id:'t4', category:null, mealType:'buatomonuoc', chay:false, region:null, name:'Bún riêu cua', time:50, ingredients:['bún','cua đồng','cà chua','đậu hũ','me'], steps:['Cua đồng giã hoặc xay, lọc lấy nước, bỏ xác.','Đun nước cua trên lửa vừa đến khi riêu cua nổi lên, vớt riêng ra.','Phi thơm cà chua làm màu, đổ vào nồi nước dùng cùng nước me chua nhẹ.','Đậu hũ chiên vàng, cắt miếng, cho vào nồi cùng riêu cua.','Trụng bún, chan nước dùng, ăn kèm rau sống.']},
    {id:'t5', category:null, mealType:'buatomonuoc', chay:false, region:'nam', name:'Hủ tiếu Nam Vang', time:45, ingredients:['hủ tiếu','thịt bằm','tôm','xương heo'], steps:['Xương heo ninh lấy nước dùng, vớt bọt.','Tôm luộc chín, bóc vỏ. Thịt bằm xào chín, tơi.','Nêm nước dùng với nước mắm, muối, đường cho vừa vị.','Trụng hủ tiếu, xếp tôm, thịt bằm lên trên, chan nước dùng, rắc hành phi.']},
    {id:'t6', category:null, mealType:'buatomonuoc', chay:false, region:null, name:'Nui xào bò', time:20, ingredients:['nui','thịt bò','cà chua','hành tây'], steps:['Nui luộc chín tới, xả nước lạnh, để ráo.','Thịt bò thái mỏng, ướp tỏi, tiêu 10 phút.','Xào thịt bò lửa lớn đến tái, gắp ra.','Xào cà chua, hành tây cho ra nước sốt, cho nui vào đảo đều.','Cho thịt bò lại vào, nêm gia vị, đảo đều, tắt bếp.']},
    {id:'t7', category:null, mealType:'buatomonuoc', chay:true, region:null, name:'Bún chay nấm', time:30, ingredients:['bún','nấm','đậu hũ','cà rốt','rau cải'], steps:['Nấm, đậu hũ, cà rốt sơ chế, cắt miếng vừa ăn.','Đun nước dùng chay từ nấm và rau củ trong 30 phút.','Đậu hũ chiên vàng, cho vào nồi nước dùng cùng nấm.','Nêm nước tương, muối cho vừa vị.','Trụng bún, chan nước dùng, thêm rau cải, dùng nóng.']},
    {id:'t8', category:null, mealType:'buatomonuoc', chay:true, region:'bac', name:'Phở chay', time:40, ingredients:['bánh phở','đậu hũ','nấm','củ cải','hành tây'], steps:['Củ cải, hành tây nướng thơm cho vào nồi nước ninh cùng nấm hương 1 tiếng lấy vị ngọt.','Đậu hũ chiên vàng, cắt miếng.','Nêm nước dùng với nước tương, muối cho vừa vị.','Trụng bánh phở, xếp đậu hũ và nấm lên trên, chan nước dùng, rắc hành ngò.']},
    {id:'t9', category:null, mealType:'buatomonuoc', chay:false, region:null, name:'Bún chả', time:35, ingredients:['bún','thịt ba chỉ','thịt bằm','nước mắm chấm'], steps:['Thịt ba chỉ thái lát, thịt bằm viên tròn dẹt, ướp gia vị 20 phút.','Nướng thịt trên than hoa hoặc chảo đến chín vàng thơm.','Pha nước mắm chấm chua ngọt, thả thịt nướng vào.','Trụng bún, ăn kèm bún, rau sống và nước mắm chấm có thịt.']}
  ];

  var LS_KEYS = { dishes:'hnng_dishes_v1', history:'hnng_history_v1', favorites:'hnng_favorites_v1', today:'hnng_todaymenu_v1', shop:'hnng_shopcheck_v1', seedVer:'hnng_seedver_v1', chayFilter:'hnng_chayfilter_v1', householdCode:'hnng_householdcode_v1' };
  var SEED_VERSION = 3; // bump when SEED_DISHES content (e.g. steps, chay/region/mealType) changes, to backfill saved dishes
  // Keys whose value belongs to the Hộ gia đình record (ADR-0001) — writing any of these
  // schedules a debounced push to the backend when a household is active.
  var HOUSEHOLD_SYNCED_KEYS = [LS_KEYS.dishes, LS_KEYS.history, LS_KEYS.favorites, LS_KEYS.today, LS_KEYS.shop, LS_KEYS.chayFilter];

  function safeGet(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
    if(HOUSEHOLD_SYNCED_KEYS.indexOf(key) !== -1){ scheduleHouseholdSync(); }
  }

  function track(name, props){
    try{ window.va && window.va('event', props ? Object.assign({name:name}, props) : {name:name}); }catch(e){}
  }

  var state = {
    dishes: safeGet(LS_KEYS.dishes, null) || SEED_DISHES.slice(),
    history: safeGet(LS_KEYS.history, []),
    favorites: safeGet(LS_KEYS.favorites, []),
    todayMenu: safeGet(LS_KEYS.today, null), // {dishIds:[..], date, mealType}
    shopChecked: safeGet(LS_KEYS.shop, {}),
    chayFilter: safeGet(LS_KEYS.chayFilter, false),
    householdCode: safeGet(LS_KEYS.householdCode, null),
    syncStatus: 'idle', // idle | loading | pending | saving | saved | error
    activeTab: 'today',
    catFilter: 'all',
    mgmtChayFilter: false,
    editingDishId: null
  };
  if(!state.dishes.length){ state.dishes = SEED_DISHES.slice(); }

  // Backfill recipe steps + new fields (mealType/chay/region) into dishes saved by an older
  // version of the app, without touching names/ingredients the user already edited — and add
  // brand-new seed dishes (Bữa 1 món, món chay bổ sung...) that an older saved list doesn't have yet.
  var storedSeedVer = safeGet(LS_KEYS.seedVer, 1);
  if(storedSeedVer < SEED_VERSION){
    var seedMap = {};
    SEED_DISHES.forEach(function(sd){ seedMap[sd.id] = sd; });
    var existingIds = {};
    state.dishes.forEach(function(d){
      existingIds[d.id] = true;
      var sd = seedMap[d.id];
      if((!d.steps || !d.steps.length) && sd && sd.steps){ d.steps = sd.steps.slice(); }
      if(d.mealType === undefined){ d.mealType = 'buacom'; }
      if(d.chay === undefined){ d.chay = sd ? !!sd.chay : false; }
      if(d.region === undefined){ d.region = sd ? sd.region : null; }
    });
    SEED_DISHES.forEach(function(sd){
      if(!existingIds[sd.id]){ state.dishes.push(Object.assign({}, sd)); }
    });
  }
  safeSet(LS_KEYS.dishes, state.dishes);
  safeSet(LS_KEYS.seedVer, SEED_VERSION);

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDate(str){
    var p = str.split('-');
    return p[2] + '/' + p[1];
  }
  function dishById(id){ return state.dishes.find(function(d){ return d.id === id; }); }

  // Giữ đúng thứ tự hiển thị Xào/Luộc/Salad -> Canh -> Món mặn cho Bữa cơm 3 món,
  // bất kể món nào vừa được đổi (reroll) hay thứ tự lưu trong dishIds.
  function sortIdsByCategoryOrder(ids){
    var dishes = ids.map(dishById).filter(Boolean);
    return CAT_ORDER.map(function(cat){
      return dishes.find(function(d){ return d.category === cat; });
    }).filter(Boolean).map(function(d){ return d.id; });
  }
  function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function recentIds(days){
    var cutoff = Date.now() - days*86400000;
    var ids = {};
    state.history.forEach(function(h){
      if(new Date(h.date).getTime() >= cutoff){
        h.dishIds.forEach(function(id){ ids[id] = true; });
      }
    });
    return ids;
  }

  function avoidIdsForCategory(excludeId){
    var ids = Object.keys(recentIds(4));
    if(excludeId) ids.push(excludeId);
    return ids;
  }

  function randomizeAll(){
    var avoidByCategory = {};
    CAT_ORDER.forEach(function(cat){ avoidByCategory[cat] = avoidIdsForCategory(); });
    var menu = buildBuaComMenu(state.dishes, { chay: state.chayFilter, avoidIdsByCategory: avoidByCategory });
    var missing = CAT_ORDER.filter(function(cat){ return !menu[cat]; });
    var picks = CAT_ORDER.map(function(cat){ return menu[cat]; }).filter(Boolean);
    state.todayMenu = { dishIds: picks.map(function(d){ return d.id; }), date: todayStr(), mealType: 'buacom' };
    state.shopChecked = {};
    if(missing.length){
      showToast('Chưa đủ món chay cho nhóm: ' + missing.map(function(c){ return CAT[c]; }).join(', '));
    }
    safeSet(LS_KEYS.today, state.todayMenu);
    safeSet(LS_KEYS.shop, state.shopChecked);
    track('random_menu');
    renderToday();
  }

  function rerollSlot(category){
    if(!state.todayMenu || state.todayMenu.mealType !== 'buacom') return randomizeAll();
    var currentIds = state.todayMenu.dishIds.slice();
    var currentInCat = currentIds.map(dishById).find(function(d){ return d && d.category === category; });
    var pool = filterDishes(state.dishes, { mealType:'buacom', category: category, chay: state.chayFilter });
    var next = pickRandom(pool, avoidIdsForCategory(currentInCat ? currentInCat.id : null));
    if(!next){ showToast('Không còn món khác trong nhóm này'); return; }
    var otherIds = currentIds.filter(function(id){ var d = dishById(id); return !d || d.category !== category; });
    state.todayMenu.dishIds = sortIdsByCategoryOrder(otherIds.concat([next.id]));
    safeSet(LS_KEYS.today, state.todayMenu);
    track('reroll_dish', {category: category});
    renderToday();
  }

  function randomizeMonNuoc(){
    var picked = pickMonNuoc(state.dishes, { chay: state.chayFilter });
    if(!picked){ showToast('Chưa có món Bữa 1 món nào phù hợp'); return; }
    state.todayMenu = { dishIds: [picked.id], date: todayStr(), mealType: 'buatomonuoc' };
    state.shopChecked = {};
    safeSet(LS_KEYS.today, state.todayMenu);
    safeSet(LS_KEYS.shop, state.shopChecked);
    track('random_monnuoc');
    renderToday();
  }

  function rerollMonNuoc(){
    if(!state.todayMenu || state.todayMenu.mealType !== 'buatomonuoc') return;
    var currentId = state.todayMenu.dishIds[0];
    var next = pickMonNuoc(state.dishes, { chay: state.chayFilter, avoidId: currentId });
    if(!next){ showToast('Không còn món Bữa 1 món khác'); return; }
    state.todayMenu.dishIds = [next.id];
    safeSet(LS_KEYS.today, state.todayMenu);
    track('reroll_dish', {category: 'buatomonuoc'});
    renderToday();
  }

  function switchToBuaCom(){
    randomizeAll();
  }

  function toggleChayFilter(){
    state.chayFilter = !state.chayFilter;
    safeSet(LS_KEYS.chayFilter, state.chayFilter);
    track('toggle_chay', {on: state.chayFilter});
    if(state.todayMenu && state.todayMenu.mealType === 'buatomonuoc'){ randomizeMonNuoc(); }
    else { randomizeAll(); }
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function markCooked(){
    if(!state.todayMenu) return;
    var d = todayStr();
    var existing = state.history.find(function(h){ return h.date === d; });
    if(existing){ existing.dishIds = state.todayMenu.dishIds; existing.mealType = state.todayMenu.mealType; }
    else{ state.history.unshift({date:d, dishIds: state.todayMenu.dishIds, mealType: state.todayMenu.mealType}); }
    state.history = state.history.slice(0, 60);
    safeSet(LS_KEYS.history, state.history);
    track('mark_cooked');
    renderToday();
    showToast('Đã ghi nhận thực đơn hôm nay!');
  }

  function renderToday(){
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('vi-VN', {weekday:'long', day:'numeric', month:'numeric', year:'numeric'});

    var menuList = document.getElementById('menuList');
    if(!state.todayMenu){
      renderMealControls();
      menuList.innerHTML = '<div class="card empty">Bấm "Random thực đơn" để bắt đầu nhé!</div>';
      document.getElementById('shoppingCard').innerHTML = '<div class="empty">Chưa có món nào.</div>';
      document.getElementById('cookedBanner').innerHTML = '';
      renderHistory();
      return;
    }
    renderMealControls();

    if(state.todayMenu.mealType !== 'buatomonuoc'){
      var sortedIds = sortIdsByCategoryOrder(state.todayMenu.dishIds);
      if(sortedIds.join(',') !== state.todayMenu.dishIds.join(',')){
        state.todayMenu.dishIds = sortedIds;
        safeSet(LS_KEYS.today, state.todayMenu);
      }
    }
    var dishes = state.todayMenu.dishIds.map(dishById).filter(Boolean);
    menuList.innerHTML = dishes.map(function(d){
      return '<div class="card dish-slot">' +
        '<div style="min-width:0">' +
          '<span class="cat-tag">' + (d.mealType === 'buatomonuoc' ? 'Bữa 1 món' : CAT[d.category]) + dishBadges(d) + '</span>' +
          '<div class="dish-name">' + escapeHtml(d.name) + '</div>' +
          '<div class="dish-meta">' + (d.time ? d.time + ' phút · ' : '') + d.ingredients.length + ' nguyên liệu</div>' +
          '<div class="dish-ingr">' + d.ingredients.map(escapeHtml).join(', ') + '</div>' +
          renderRecipe(d) +
        '</div>' +
        '<div class="slot-actions">' +
          '<button class="icon-btn" data-reroll="' + (d.mealType === 'buatomonuoc' ? 'buatomonuoc' : d.category) + '" title="Đổi món khác">⟲</button>' +
        '</div>' +
      '</div>';
    }).join('');

    var existing = state.history.find(function(h){ return h.date === todayStr(); });
    var cooked = existing && sameSet(existing.dishIds, state.todayMenu.dishIds);
    document.getElementById('cookedBanner').innerHTML = cooked ? '<div class="cooked-banner">✓ Đã nấu thực đơn này hôm nay</div>' : '';

    renderShopping(dishes);
    renderHistory();
  }

  function sameSet(a,b){
    if(a.length !== b.length) return false;
    var sa = a.slice().sort(), sb = b.slice().sort();
    return sa.every(function(v,i){ return v === sb[i]; });
  }

  function renderShopping(dishes){
    var card = document.getElementById('shoppingCard');
    var items = {}; // name -> [dishNames]
    dishes.forEach(function(d){
      d.ingredients.forEach(function(ing){
        var key = ing.trim().toLowerCase();
        if(!items[key]) items[key] = { label: ing.trim(), from: [] };
        items[key].from.push(d.name);
      });
    });
    var keys = Object.keys(items);
    if(!keys.length){ card.innerHTML = '<div class="empty">Chưa có món nào.</div>'; return; }
    card.innerHTML = keys.map(function(k){
      var it = items[k];
      var checked = !!state.shopChecked[k];
      return '<label class="shopping-item' + (checked?' checked':'') + '">' +
        '<input type="checkbox" data-ing="' + encodeURIComponent(k) + '" ' + (checked?'checked':'') + '>' +
        '<span>' + escapeHtml(it.label) + '</span>' +
        '<span class="from">' + escapeHtml(it.from.join(', ')) + '</span>' +
      '</label>';
    }).join('');
  }

  function renderHistory(){
    var card = document.getElementById('historyCard');
    var recent = state.history.slice(0, 7);
    if(!recent.length){ card.innerHTML = '<div class="empty">Chưa có lịch sử nấu ăn.</div>'; return; }
    card.innerHTML = recent.map(function(h){
      var names = h.dishIds.map(function(id){ var d = dishById(id); return d ? d.name : '(đã xoá)'; }).join(' · ');
      var prefix = h.mealType === 'buatomonuoc' ? '🍜 ' : '';
      return '<div class="history-row"><span class="h-date">' + fmtDate(h.date) + '</span><span class="h-dishes">' + prefix + escapeHtml(names) + '</span></div>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderRecipe(d){
    if(!d.steps || !d.steps.length) return '';
    return '<details class="recipe" data-dish="' + escapeHtml(d.name) + '"><summary>Xem cách nấu (' + d.steps.length + ' bước)</summary>' +
      '<ol>' + d.steps.map(function(s){ return '<li>' + escapeHtml(s) + '</li>'; }).join('') + '</ol>' +
    '</details>';
  }

  function dishBadges(d){
    var badges = '';
    if(d.chay) badges += '<span class="badge badge-chay">Chay</span>';
    if(d.region && REGION[d.region]) badges += '<span class="badge badge-region">' + REGION[d.region] + '</span>';
    return badges ? '<span class="badge-row">' + badges + '</span>' : '';
  }

  function renderMealControls(){
    var isMonNuoc = state.todayMenu && state.todayMenu.mealType === 'buatomonuoc';
    var chips = [
      '<button class="chip' + (state.chayFilter ? ' active' : '') + '" id="btnToggleChay">' + (state.chayFilter ? '✓ ' : '') + 'Món chay</button>'
    ];
    chips.push('<button class="chip' + (isMonNuoc ? ' active' : '') + '" id="btnToggleMealType" title="' + (isMonNuoc ? 'Bấm để quay lại Bữa cơm 3 món' : '') + '">🍜 Nấu 1 món</button>');
    document.getElementById('mealControls').innerHTML = chips.join('');
  }

  // ---- Dishes management ----
  function renderDishes(){
    var filterRow = document.getElementById('catFilter');
    var cats = [['all','Tất cả']].concat(CAT_ORDER.map(function(c){ return [c, CAT[c]]; })).concat([['buatomonuoc','Bữa 1 món']]);
    filterRow.innerHTML = cats.map(function(c){
      return '<button class="chip' + (state.catFilter===c[0]?' active':'') + '" data-cat="' + c[0] + '">' + c[1] + '</button>';
    }).join('') + '<button class="chip' + (state.mgmtChayFilter?' active':'') + '" id="btnMgmtChayFilter">Chay</button>';

    var listCard = document.getElementById('dishListCard');
    var list = state.dishes.filter(function(d){
      if(state.mgmtChayFilter && !d.chay) return false;
      if(state.catFilter === 'all') return true;
      if(state.catFilter === 'buatomonuoc') return d.mealType === 'buatomonuoc';
      return d.mealType !== 'buatomonuoc' && d.category === state.catFilter;
    });
    list.sort(function(a,b){
      var ca = a.mealType === 'buatomonuoc' ? 'zzz' : a.category;
      var cb = b.mealType === 'buatomonuoc' ? 'zzz' : b.category;
      return ca.localeCompare(cb) || a.name.localeCompare(b.name,'vi');
    });
    if(!list.length){ listCard.innerHTML = '<div class="empty">Không có món nào.</div>'; return; }
    listCard.innerHTML = list.map(function(d){
      var catLabel = d.mealType === 'buatomonuoc' ? 'Bữa 1 món' : CAT[d.category];
      return '<div class="dish-row">' +
        '<div class="info">' +
          '<div class="dname">' + escapeHtml(d.name) + dishBadges(d) + '</div>' +
          '<div class="dmeta">' + catLabel + (d.time ? ' · ' + d.time + ' phút' : '') + ' · ' + d.ingredients.join(', ') + '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="icon-btn" data-edit="' + d.id + '" title="Sửa">✎</button>' +
          '<button class="icon-btn" data-delete="' + d.id + '" title="Xoá">🗑</button>' +
        '</div>' +
        renderRecipe(d) +
      '</div>';
    }).join('');
  }

  function updateCategoryVisibility(){
    var isMonNuoc = document.getElementById('fMealType').value === 'buatomonuoc';
    document.getElementById('fCategoryWrap').hidden = isMonNuoc;
  }

  function openDishForm(dish){
    state.editingDishId = dish ? dish.id : null;
    document.getElementById('dishFormTitle').textContent = dish ? 'Sửa món' : 'Thêm món mới';
    document.getElementById('fName').value = dish ? dish.name : '';
    document.getElementById('fMealType').value = dish && dish.mealType === 'buatomonuoc' ? 'buatomonuoc' : 'buacom';
    document.getElementById('fCategory').value = dish && dish.category ? dish.category : 'xao';
    document.getElementById('fTime').value = dish && dish.time ? dish.time : '';
    document.getElementById('fRegion').value = dish && dish.region ? dish.region : '';
    document.getElementById('fChay').checked = !!(dish && dish.chay);
    document.getElementById('fIngredients').value = dish ? dish.ingredients.join(', ') : '';
    document.getElementById('fSteps').value = dish && dish.steps ? dish.steps.join('\n') : '';
    updateCategoryVisibility();
    document.getElementById('dishModalBackdrop').hidden = false;
  }
  function closeDishForm(){ document.getElementById('dishModalBackdrop').hidden = true; }

  function saveDishForm(e){
    e.preventDefault();
    var name = document.getElementById('fName').value.trim();
    if(!name) return;
    var mealType = document.getElementById('fMealType').value;
    var category = mealType === 'buatomonuoc' ? null : document.getElementById('fCategory').value;
    var time = parseInt(document.getElementById('fTime').value, 10) || null;
    var region = document.getElementById('fRegion').value || null;
    var chay = document.getElementById('fChay').checked;
    var ingredients = document.getElementById('fIngredients').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var steps = document.getElementById('fSteps').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if(state.editingDishId){
      var d = dishById(state.editingDishId);
      if(d){ d.name = name; d.mealType = mealType; d.category = category; d.time = time; d.region = region; d.chay = chay; d.ingredients = ingredients; d.steps = steps; }
      track('edit_dish', {category: category || 'buatomonuoc'});
    } else {
      state.dishes.push({ id: uid(), name:name, mealType:mealType, category:category, time:time, region:region, chay:chay, ingredients:ingredients, steps:steps });
      track('add_dish', {category: category || 'buatomonuoc'});
    }
    safeSet(LS_KEYS.dishes, state.dishes);
    closeDishForm();
    renderDishes();
    renderToday();
    showToast('Đã lưu món ăn!');
  }

  function deleteDish(id){
    state.dishes = state.dishes.filter(function(d){ return d.id !== id; });
    safeSet(LS_KEYS.dishes, state.dishes);
    track('delete_dish');
    renderDishes();
  }

  // ---- Favorites ----
  function renderFavorites(){
    var wrap = document.getElementById('favList');
    if(!state.favorites.length){
      wrap.innerHTML = '<div class="card empty">Chưa có thực đơn yêu thích nào.<br>Random 1 thực đơn ngon rồi bấm "Lưu" nhé!</div>';
      return;
    }
    wrap.innerHTML = state.favorites.map(function(f){
      var names = f.dishIds.map(function(id){ var d = dishById(id); return d ? d.name : '(đã xoá)'; }).join(' · ');
      return '<div class="card fav-card">' +
        '<div class="fav-name">' + escapeHtml(f.name) + '</div>' +
        '<div class="fav-dishes">' + escapeHtml(names) + '</div>' +
        '<div class="fav-actions">' +
          '<button class="btn btn-ghost" data-use-fav="' + f.id + '">Dùng lại</button>' +
          '<button class="btn btn-ghost btn-danger" data-del-fav="' + f.id + '">Xoá</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ---- tabs ----
  function setTab(tab){
    state.activeTab = tab;
    document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
    document.querySelectorAll('main section').forEach(function(s){ s.classList.toggle('active', s.id==='tab-'+tab); });
    if(tab==='dishes') renderDishes();
    if(tab==='favorites') renderFavorites();
    if(tab==='household') renderHousehold();
  }

  // ---- event wiring ----
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });

  document.getElementById('btnRandomAll').addEventListener('click', randomizeAll);
  document.getElementById('btnMarkCooked').addEventListener('click', markCooked);
  document.getElementById('btnAddDish').addEventListener('click', function(){ openDishForm(null); });
  document.getElementById('fCancel').addEventListener('click', closeDishForm);
  document.getElementById('dishForm').addEventListener('submit', saveDishForm);
  document.getElementById('fMealType').addEventListener('change', updateCategoryVisibility);

  document.getElementById('menuList').addEventListener('click', function(e){
    var btn = e.target.closest('[data-reroll]');
    if(!btn) return;
    if(btn.dataset.reroll === 'buatomonuoc') rerollMonNuoc();
    else rerollSlot(btn.dataset.reroll);
  });

  document.getElementById('mealControls').addEventListener('click', function(e){
    if(e.target.closest('#btnToggleChay')) toggleChayFilter();
    if(e.target.closest('#btnToggleMealType')){
      if(state.todayMenu && state.todayMenu.mealType === 'buatomonuoc') switchToBuaCom();
      else randomizeMonNuoc();
    }
  });

  document.getElementById('shoppingCard').addEventListener('change', function(e){
    var input = e.target.closest('input[data-ing]');
    if(!input) return;
    var key = decodeURIComponent(input.dataset.ing);
    if(input.checked) state.shopChecked[key] = true; else delete state.shopChecked[key];
    safeSet(LS_KEYS.shop, state.shopChecked);
    input.closest('.shopping-item').classList.toggle('checked', input.checked);
  });

  document.getElementById('catFilter').addEventListener('click', function(e){
    var chip = e.target.closest('[data-cat]');
    if(chip){ state.catFilter = chip.dataset.cat; renderDishes(); return; }
    if(e.target.closest('#btnMgmtChayFilter')){ state.mgmtChayFilter = !state.mgmtChayFilter; renderDishes(); }
  });

  document.getElementById('dishListCard').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    var delBtn = e.target.closest('[data-delete]');
    if(editBtn) openDishForm(dishById(editBtn.dataset.edit));
    if(delBtn){
      if(confirm('Xoá món này khỏi ngân hàng món ăn?')) deleteDish(delBtn.dataset.delete);
    }
  });

  // Favorites: save modal
  document.getElementById('btnSaveFav').addEventListener('click', function(){
    if(!state.todayMenu){ showToast('Chưa có thực đơn để lưu'); return; }
    document.getElementById('favNameInput').value = '';
    document.getElementById('favModalBackdrop').hidden = false;
    document.getElementById('favNameInput').focus();
  });
  document.getElementById('favCancel').addEventListener('click', function(){
    document.getElementById('favModalBackdrop').hidden = true;
  });
  document.getElementById('favConfirm').addEventListener('click', function(){
    var name = document.getElementById('favNameInput').value.trim() || 'Thực đơn ' + fmtDate(todayStr());
    state.favorites.unshift({ id: uid(), name:name, dishIds: state.todayMenu.dishIds.slice(), savedAt: Date.now() });
    safeSet(LS_KEYS.favorites, state.favorites);
    track('save_favorite');
    document.getElementById('favModalBackdrop').hidden = true;
    showToast('Đã lưu vào yêu thích!');
  });

  document.getElementById('favList').addEventListener('click', function(e){
    var useBtn = e.target.closest('[data-use-fav]');
    var delBtn = e.target.closest('[data-del-fav]');
    if(useBtn){
      var f = state.favorites.find(function(x){ return x.id === useBtn.dataset.useFav; });
      if(f){
        state.todayMenu = { dishIds: f.dishIds.slice(), date: todayStr() };
        state.shopChecked = {};
        safeSet(LS_KEYS.today, state.todayMenu);
        safeSet(LS_KEYS.shop, state.shopChecked);
        track('use_favorite');
        setTab('today');
        renderToday();
        showToast('Đã áp dụng thực đơn yêu thích!');
      }
    }
    if(delBtn){
      state.favorites = state.favorites.filter(function(x){ return x.id !== delBtn.dataset.delFav; });
      safeSet(LS_KEYS.favorites, state.favorites);
      track('delete_favorite');
      renderFavorites();
    }
  });

  // 'toggle' doesn't bubble, but a capture-phase listener on document still sees it
  // as it travels down to the <details> target — this catches every recipe on the page.
  document.addEventListener('toggle', function(e){
    if(e.target.matches && e.target.matches('details.recipe') && e.target.open){
      track('view_recipe', {dish: e.target.dataset.dish || ''});
    }
  }, true);

  // ---- Household sync (Phase 2 — xem docs/spec-phase2-household-backend.md, ADR-0001) ----
  // Backend chỉ đóng vai trò lưu trữ tập trung: đọc 1 lần khi vào hộ, ghi-qua (debounce)
  // khi có thay đổi. Không real-time, không xử lý xung đột.

  var householdSyncTimer = null;

  function setSyncStatus(status){
    state.syncStatus = status;
    if(state.activeTab === 'household') renderHousehold();
  }

  function persistLocalOnly(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  function scheduleHouseholdSync(){
    if(!state.householdCode) return;
    setSyncStatus('pending');
    clearTimeout(householdSyncTimer);
    householdSyncTimer = setTimeout(pushHouseholdData, 900);
  }

  function pushHouseholdData(){
    if(!state.householdCode) return;
    var payload = serializeHouseholdData(state);
    setSyncStatus('saving');
    fetch('/api/household/' + state.householdCode, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) throw new Error('status ' + r.status);
      setSyncStatus('saved');
    }).catch(function(){
      setSyncStatus('error');
    });
  }

  function pullHouseholdData(code){
    return fetch('/api/household/' + code).then(function(r){
      if(!r.ok) throw new Error('status ' + r.status);
      return r.json();
    }).then(function(json){
      if(json && json.empty) return null;
      return parseHouseholdData(json);
    });
  }

  function applyHouseholdData(parsed){
    if(parsed.dishes && parsed.dishes.length){ state.dishes = parsed.dishes; persistLocalOnly(LS_KEYS.dishes, state.dishes); }
    state.history = parsed.history; persistLocalOnly(LS_KEYS.history, state.history);
    state.favorites = parsed.favorites; persistLocalOnly(LS_KEYS.favorites, state.favorites);
    state.todayMenu = parsed.todayMenu; persistLocalOnly(LS_KEYS.today, state.todayMenu);
    state.shopChecked = parsed.shopChecked; persistLocalOnly(LS_KEYS.shop, state.shopChecked);
    state.chayFilter = parsed.chayFilter; persistLocalOnly(LS_KEYS.chayFilter, state.chayFilter);
    renderToday();
    renderDishes();
    renderFavorites();
  }

  function getCodeFromUrl(){
    var m = location.pathname.match(/^\/h\/([^\/]+)$/);
    return m ? m[1] : null;
  }

  function createHousehold(){
    var code = generateHouseholdCode();
    state.householdCode = code;
    safeSet(LS_KEYS.householdCode, code);
    history.replaceState(null, '', '/h/' + code);
    pushHouseholdData();
    track('create_household');
    renderHousehold();
  }

  function leaveHousehold(){
    state.householdCode = null;
    localStorage.removeItem(LS_KEYS.householdCode);
    clearTimeout(householdSyncTimer);
    setSyncStatus('idle');
    history.replaceState(null, '', '/');
    track('leave_household');
    renderHousehold();
  }

  function initHousehold(){
    var urlCode = getCodeFromUrl();
    var code = urlCode || state.householdCode;
    if(!code) return;
    if(!isValidHouseholdCode(code)){
      if(urlCode) showToast('Link hộ gia đình không hợp lệ');
      return;
    }
    state.householdCode = code;
    safeSet(LS_KEYS.householdCode, code);
    if(urlCode){ history.replaceState(null, '', '/h/' + code); }
    setSyncStatus('loading');
    pullHouseholdData(code).then(function(parsed){
      if(parsed){ applyHouseholdData(parsed); setSyncStatus('saved'); }
      else { setSyncStatus('empty'); }
    }).catch(function(){ setSyncStatus('error'); });
  }

  function renderHousehold(){
    var card = document.getElementById('householdCard');
    if(!state.householdCode){
      card.innerHTML = '<div class="card" style="padding:20px;">' +
        '<h3 style="margin-bottom:8px;">Chưa có hộ gia đình</h3>' +
        '<div style="color:var(--ink-dim);font-size:14px;margin-bottom:16px;line-height:1.5;">Tạo 1 hộ gia đình để dùng chung dữ liệu (món ăn, thực đơn, lịch sử...) trên nhiều thiết bị — không cần tài khoản, chỉ cần chia sẻ 1 link.</div>' +
        '<button class="btn btn-primary" id="btnCreateHousehold" style="width:100%;justify-content:center;">Tạo hộ gia đình mới</button>' +
      '</div>';
      return;
    }
    var link = location.origin + '/h/' + state.householdCode;
    var statusLabel = {
      loading: '⏳ Đang tải dữ liệu hộ gia đình...',
      pending: '⏳ Có thay đổi chưa lưu...',
      saving: '⏳ Đang lưu...',
      saved: '✓ Đã lưu lên hộ gia đình',
      error: '⚠️ Lỗi đồng bộ — sẽ tự thử lại ở lần thay đổi tiếp theo',
      empty: 'Hộ gia đình này chưa có dữ liệu.',
      idle: ''
    }[state.syncStatus] || '';
    card.innerHTML = '<div class="card" style="padding:20px;">' +
      '<h3 style="margin-bottom:8px;">Hộ gia đình của bạn</h3>' +
      '<div style="color:var(--ink-dim);font-size:14px;margin-bottom:12px;">Gửi link này cho người thân để cùng dùng chung dữ liệu:</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:12px;">' +
        '<input type="text" readonly value="' + escapeHtml(link) + '" id="householdLinkInput" style="flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;">' +
        '<button class="btn btn-ghost" id="btnCopyHouseholdLink">Copy</button>' +
      '</div>' +
      '<div style="font-size:13px;color:var(--ink-dim);margin-bottom:16px;">' + statusLabel + '</div>' +
      '<button class="btn btn-ghost btn-danger" id="btnLeaveHousehold" style="width:100%;justify-content:center;">Rời hộ gia đình</button>' +
    '</div>';
  }

  document.getElementById('householdCard').addEventListener('click', function(e){
    if(e.target.closest('#btnCreateHousehold')) createHousehold();
    if(e.target.closest('#btnLeaveHousehold')){
      if(confirm('Rời hộ gia đình? Dữ liệu trên hộ vẫn còn nguyên, máy này sẽ chỉ dùng dữ liệu cục bộ từ giờ.')) leaveHousehold();
    }
    if(e.target.closest('#btnCopyHouseholdLink')){
      var input = document.getElementById('householdLinkInput');
      input.select();
      if(navigator.clipboard){
        navigator.clipboard.writeText(input.value).then(function(){ showToast('Đã copy link!'); }).catch(function(){});
      }
    }
  });

  // init
  initHousehold();
  if(!state.todayMenu || state.todayMenu.date !== todayStr()){
    // keep an existing same-day menu; otherwise start empty (user rerolls) but seed one for first-run delight
    if(!state.todayMenu){ randomizeAll(); }
  }
  renderToday();
})();
</script>
</body>
</html>
